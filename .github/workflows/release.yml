# Tests on Linux and macOS, then builds release archives for Linux (x86_64,
# aarch64) and macOS on Apple Silicon.
# A tag `v*` publishes them as a GitHub release (a pre-release when the tag
# has a `-`, like v0.1.0-rc.1). Started by hand ("Run workflow"), it only
# builds; the archives are attached to the run:
#   gh run download --repo Ndles/nerdmux -n nerdmux-aarch64-apple-darwin

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binaries that run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      # Rust's own linker cross-links the static aarch64 build; no C toolchain needed.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="nerdmux-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name/icons"
          cp "target/${{ matrix.target }}/release/nerdmux" README.md LICENSE scripts/setup.sh "$name/"
          # setup.sh finds the icons in icons/ next to it.
          cp docs/logo/icon.svg docs/logo/icon-*.png "$name/icons/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: nerdmux-${{ matrix.target }}
          path: nerdmux-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "nerdmux ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
