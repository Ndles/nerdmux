[package]
name = "nerdmux"
version = "0.1.0"
authors = ["Pavel Kuksa"]
edition = "2021"
description = "A terminal multiplexer with built-in sessions, windows, panes and easy keyboard navigation"
license = "MIT"
rust-version = "1.85"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
ratatui = { version = "0.29", default-features = false }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
toml_edit = "0.22"
libc = "0.2"
anyhow = "1"
unicode-width = "0.2"
base64 = "0.22"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
