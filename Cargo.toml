[package]
name = "nerdmux"
version = "0.1.0"
authors = ["Pavel Kuksa"]
edition = "2021"
description = "A terminal multiplexer with built-in sessions, windows, panes and easy keyboard navigation"
license = "MIT"
repository = "https://github.com/Ndles/nerdmux"
rust-version = "1.88"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["underline-color"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }
libc = "0.2"
anyhow = "1"
unicode-width = "0.2"
base64 = "0.22"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
